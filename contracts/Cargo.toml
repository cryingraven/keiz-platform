[workspace]
resolver = "2"
members = ["keiz-collect", "keiz-vault"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
near-sdk = { version = "=5.25.0", features = ["legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1"
