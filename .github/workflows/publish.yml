name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Set GHCR_NAMESPACE as a repository variable if you publish under another
  # owner. Pushing to keizio requires GHCR_USERNAME/GHCR_TOKEN with write:packages
  # when the repository is not owned by the keizio org.
  IMAGE_NAMESPACE: ${{ vars.GHCR_NAMESPACE || 'keizio' }}
  CHAIN_NETWORK: ${{ vars.CHAIN_NETWORK || 'mainnet' }}
  NEXT_PUBLIC_CHAIN_NETWORK: ${{ vars.NEXT_PUBLIC_CHAIN_NETWORK || 'mainnet' }}
  NEXT_PUBLIC_NEAR_NETWORK: ${{ vars.NEXT_PUBLIC_NEAR_NETWORK || '' }}

jobs:
  api:
    name: API + worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/keiz-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=keiz-api
          cache-to: type=gha,mode=max,scope=keiz-api

  web:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/keiz-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            API_URL=http://api:3001
            CHAIN_NETWORK=${{ env.CHAIN_NETWORK }}
            NEXT_PUBLIC_CHAIN_NETWORK=${{ env.NEXT_PUBLIC_CHAIN_NETWORK }}
            NEXT_PUBLIC_NEAR_NETWORK=${{ env.NEXT_PUBLIC_NEAR_NETWORK }}
          cache-from: type=gha,scope=keiz-web
          cache-to: type=gha,mode=max,scope=keiz-web
