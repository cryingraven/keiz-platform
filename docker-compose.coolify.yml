# Coolify deployment stack.
#
# MongoDB is intentionally absent: MONGODB_URI points at the existing Atlas
# cluster. Redis, the API and the BullMQ worker are deployed here.
#
# Images are published by .github/workflows/publish.yml to:
#   ghcr.io/keizio/keiz-api
#   ghcr.io/keizio/keiz-web
#
# In Coolify, point the Docker Compose resource at this file, set the env vars
# from .env.coolify.example, and map the public domain to the web service.

name: keiz

x-keiz-env: &keiz-env
  NODE_ENV: production
  API_PORT: "3001"

  # Public identity. These four must be the real HTTPS deployment or the API
  # refuses to start in production.
  APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public domain, e.g. app.example.com}
  WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public origin, e.g. https://app.example.com}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID to the public registrable domain}
  WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?Set WEBAUTHN_ORIGINS to the HTTPS origin}

  # Atlas connection string, e.g.
  # mongodb+srv://user:pass@cluster.mongodb.net/keiz?retryWrites=true&w=majority
  MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the Atlas connection string}
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-keiz}

  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}

  CHAIN_NETWORK: ${CHAIN_NETWORK:-mainnet}
  NEXT_PUBLIC_CHAIN_NETWORK: ${NEXT_PUBLIC_CHAIN_NETWORK:-mainnet}
  NEAR_NETWORK: ${NEAR_NETWORK:-mainnet}
  NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.mainnet.near.org}
  NEAR_TESTNET_RPC_URL: ${NEAR_TESTNET_RPC_URL:-https://rpc.testnet.near.org}

  PAYMENTS_MODE: ${PAYMENTS_MODE:-mock}
  NEAR_INTENTS_BASE_URL: ${NEAR_INTENTS_BASE_URL:-https://1click.chaindefuser.com}
  NEAR_INTENTS_JWT: ${NEAR_INTENTS_JWT:-}
  NEAR_INTENTS_REFERRAL: ${NEAR_INTENTS_REFERRAL:-keiz}

  CHAT_PROVIDER: ${CHAT_PROVIDER:-mastra}
  NEARAI_API_KEY: ${NEARAI_API_KEY:-}
  NEAR_AI_BASE_URL: ${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
  NEAR_AI_MODEL: ${NEAR_AI_MODEL:-nearai/deepseek-ai/DeepSeek-V4.1-Flash-1017}

  AGENT_WALLET_MASTER_KEY: ${AGENT_WALLET_MASTER_KEY:?Set AGENT_WALLET_MASTER_KEY, e.g. openssl rand -hex 32}
  AGENT_ACCOUNT_ID: ${AGENT_ACCOUNT_ID:-agent.mainnet}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-KEIZ}

  OUTLAYER_ENABLED: ${OUTLAYER_ENABLED:-false}
  OUTLAYER_NETWORK: ${OUTLAYER_NETWORK:-mainnet}
  OUTLAYER_BASE_URL: ${OUTLAYER_BASE_URL:-https://api.outlayer.ai}

  KEIZ_COLLECT_CODE_HASH: ${KEIZ_COLLECT_CODE_HASH:-}
  COLLECT_DEPLOY_ENABLED: ${COLLECT_DEPLOY_ENABLED:-false}
  COLLECT_DEPLOYER_ACCOUNT: ${COLLECT_DEPLOYER_ACCOUNT:-}
  COLLECT_DEPLOYER_PRIVATE_KEY: ${COLLECT_DEPLOYER_PRIVATE_KEY:-}
  COLLECT_WASM_PATH: ${COLLECT_WASM_PATH:-}
  COLLECT_DEPLOY_FUNDING_NEAR: ${COLLECT_DEPLOY_FUNDING_NEAR:-4}

  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  QUEUES_ENABLED: ${QUEUES_ENABLED:-true}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-keiz}
  PAYMENT_SWEEP_INTERVAL_MS: ${PAYMENT_SWEEP_INTERVAL_MS:-30000}
  INDEXER_INTERVAL_MS: ${INDEXER_INTERVAL_MS:-30000}

services:
  web:
    image: ghcr.io/keizio/keiz-web:${KEIZ_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Coolify's reverse proxy targets this port. Do not publish the API.
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/keizio/keiz-api:${KEIZ_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3001"
    environment: *keiz-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r) => r.json()).then((b) => process.exit(b.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Same image as the API, different entry point. Keep one replica by default;
  # BullMQ will distribute jobs if you scale it later.
  worker:
    image: ghcr.io/keizio/keiz-api:${KEIZ_IMAGE_TAG:-latest}
    pull_policy: always
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *keiz-env
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  # Remove this service if you use a managed/external Redis and point
  # REDIS_URL at it instead.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis-data:
